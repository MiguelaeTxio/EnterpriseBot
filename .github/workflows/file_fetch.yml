# /home/MiguelAeTxio/PROJECTS/EnterpriseBot/.github/workflows/file_fetch.yml
name: Descarga de solo lectura de archivo (PythonAnywhere / GCS) — EnterpriseBot

# H31 (S112). Trae un archivo del servidor (PythonAnywhere) o de GCS al
# modelo sin sftp manual de Miguel Ángel y SIN comitear nada a git --
# ver com-actions-relay. El resultado se sube a la carpeta de Drive
# "EnterpriseBot - Intercambio Claude" (id fijo abajo, ya creada y
# verificada en S112) con la credencial OAuth drive.file ya configurada
# del proyecto (spare_parts.gdrive_service). El modelo lo lee con su
# propio conector de Drive y lo manda a la papelera en cuanto lo tiene.
#
# NUNCA usar un artifact de Actions como mecanismo de entrega --
# verificado real en S112 que la descarga falla siempre (host de blob
# storage no determinista, no está en la lista de red permitida del
# modelo).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Origen del archivo"
        required: true
        type: choice
        options:
          - pythonanywhere
          - gcs
      remote_path:
        description: "pythonanywhere: ruta absoluta en el servidor. gcs: 'bucket/ruta/al/blob'"
        required: true
        type: string
      tail_lines:
        description: "Opcional (solo pythonanywhere, texto): últimas N líneas. 0 = archivo completo."
        required: false
        default: "0"
        type: string

env:
  DRIVE_FOLDER_ID: "1SSHSY2FHt-7eN17Wgza2Qcybs-ij6to0"

concurrency:
  group: enterprisebot-file-readonly-fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar clave SSH dedicada (solo lectura, misma que db_query.yml)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_DB_READONLY_SSH_PRIVATE_KEY }}" > ~/.ssh/pa_readonly_key
          chmod 600 ~/.ssh/pa_readonly_key
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: Subir el script de subida a Drive (una sola vez, lo usan ambos modos)
        run: |
          scp -i ~/.ssh/pa_readonly_key .github/scripts/drive_upload.py \
            MiguelAeTxio@ssh.pythonanywhere.com:/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py

      - name: PythonAnywhere — preparar el archivo y subirlo a Drive
        if: inputs.mode == 'pythonanywhere'
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
          TAIL_LINES: ${{ inputs.tail_lines }}
        run: |
          set +e
          DRIVE_SCRIPT="/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py"
          DRIVE_NAME="$(basename "$REMOTE_PATH")_${{ github.run_id }}"
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; TARGET='$REMOTE_PATH'; if [ '$TAIL_LINES' != '0' ]; then TARGET=/home/MiguelAeTxio/SWAP/file_fetch_${{ github.run_id }}.txt; tail -n '$TAIL_LINES' '$REMOTE_PATH' > \"\$TARGET\"; fi; python -m dotenv run python3 '$DRIVE_SCRIPT' \"\$TARGET\" '$DRIVE_NAME' '${{ env.DRIVE_FOLDER_ID }}'; rm -f '$DRIVE_SCRIPT' /home/MiguelAeTxio/SWAP/file_fetch_${{ github.run_id }}.txt" \
            > /tmp/result.txt 2>&1
          echo "EXIT=$?" >> /tmp/result.txt
          echo "DRIVE_NAME=$DRIVE_NAME" >> /tmp/result.txt
          cat /tmp/result.txt

      - name: GCS — bajar a SWAP en el servidor y subirlo a Drive
        if: inputs.mode == 'gcs'
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
        run: |
          set +e
          BUCKET=$(printf '%s' "$REMOTE_PATH" | cut -d'/' -f1)
          BLOB=$(printf '%s' "$REMOTE_PATH" | cut -d'/' -f2-)
          TMP_PATH="/home/MiguelAeTxio/SWAP/file_fetch_${{ github.run_id }}"
          GCS_SCRIPT_PATH="/home/MiguelAeTxio/SWAP/gcs_fetch_${{ github.run_id }}.py"
          DRIVE_SCRIPT="/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py"
          DRIVE_NAME="$(basename "$REMOTE_PATH")_${{ github.run_id }}"
          scp -i ~/.ssh/pa_readonly_key .github/scripts/gcs_fetch.py \
            MiguelAeTxio@ssh.pythonanywhere.com:"$GCS_SCRIPT_PATH"
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; python -m dotenv run python3 '$GCS_SCRIPT_PATH' '$BUCKET' '$BLOB' '$TMP_PATH'; python -m dotenv run python3 '$DRIVE_SCRIPT' '$TMP_PATH' '$DRIVE_NAME' '${{ env.DRIVE_FOLDER_ID }}'; rm -f '$TMP_PATH' '$GCS_SCRIPT_PATH' '$DRIVE_SCRIPT'" \
            > /tmp/result.txt 2>&1
          echo "EXIT=$?" >> /tmp/result.txt
          echo "DRIVE_NAME=$DRIVE_NAME" >> /tmp/result.txt
          cat /tmp/result.txt

      - name: Resumen en el propio Action (no sensible -- solo nombres/estado)
        if: always()
        run: |
          {
            echo "## Descarga de archivo -> Drive"
            echo "**Modo:** ${{ inputs.mode }}  —  **Origen:** ${{ inputs.remote_path }}"
            echo '```'
            cat /tmp/result.txt 2>/dev/null || echo "(sin salida -- ver pasos anteriores)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar clave SSH
        if: always()
        run: rm -f ~/.ssh/pa_readonly_key
