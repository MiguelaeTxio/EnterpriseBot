# /home/MiguelAeTxio/PROJECTS/EnterpriseBot/.github/workflows/file_fetch.yml
name: Descarga de solo lectura de archivo (PythonAnywhere / GCS) — EnterpriseBot

# H31 (S112). Trae un archivo del servidor (PythonAnywhere) o de GCS al
# modelo sin sftp manual de Miguel Ángel y SIN comitear nada a git --
# ver com-actions-relay. El resultado se sube a la carpeta de Drive
# "EnterpriseBot - Intercambio Claude" (id fijo abajo, ya creada y
# verificada en S112) con la credencial OAuth drive.file ya configurada
# del proyecto (spare_parts.gdrive_service). El modelo lo lee con su
# propio conector de Drive y lo manda a la papelera en cuanto lo tiene.
#
# NUNCA usar un artifact de Actions como mecanismo de entrega --
# verificado real en S112 que la descarga falla siempre (host de blob
# storage no determinista, no está en la lista de red permitida del
# modelo).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Origen del archivo"
        required: true
        type: choice
        options:
          - pythonanywhere
          - gcs
          - gcs_text
          - gcs_image
          - gcs_unrar
      remote_path:
        description: "pythonanywhere: ruta absoluta en el servidor. gcs: 'bucket/ruta/al/blob' o 'id/<pk>'. gcs_text: varios 'bucket/blob' separados por ' || '. gcs_image: ids separados por comas. gcs_unrar: UN id"
        required: true
        type: string
      tail_lines:
        description: "Opcional (solo pythonanywhere, texto): últimas N líneas. 0 = archivo completo."
        required: false
        default: "0"
        type: string
      grep_pattern:
        description: "Opcional (solo pythonanywhere): expresión regular (grep -E). Si se da, remote_path admite comodines (p. ej. /var/log/x.error.log*) y solo se sube lo que coincida, también dentro de los .gz."
        required: false
        default: ""
        type: string
      dpi:
        description: "Opcional (solo gcs_image): resolución del render. 110 por defecto; 220 para letra manuscrita sobre trama."
        required: false
        default: "110"
        type: string
      max_pages:
        description: "Opcional (solo gcs_image): páginas máximas por documento. 4 por defecto; más para PDF que agrupan varios documentos (S121)."
        required: false
        default: "4"
        type: string

env:
  DRIVE_FOLDER_ID: "1SSHSY2FHt-7eN17Wgza2Qcybs-ij6to0"

concurrency:
  group: enterprisebot-file-readonly-fetch
  cancel-in-progress: false

# S119: contents write SOLO para publicar los PNG del modo gcs_image como
# adjuntos de la release privada "relevo-imagenes" (nunca un commit).
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Preparar clave SSH dedicada (solo lectura, misma que db_query.yml)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_DB_READONLY_SSH_PRIVATE_KEY }}" > ~/.ssh/pa_readonly_key
          chmod 600 ~/.ssh/pa_readonly_key
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: Subir el script de subida a Drive (una sola vez, lo usan ambos modos)
        run: |
          scp -i ~/.ssh/pa_readonly_key .github/scripts/drive_upload.py \
            MiguelAeTxio@ssh.pythonanywhere.com:/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py

      - name: PythonAnywhere — preparar el archivo y subirlo a Drive
        if: inputs.mode == 'pythonanywhere'
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
          TAIL_LINES: ${{ inputs.tail_lines }}
          GREP_PATTERN: ${{ inputs.grep_pattern }}
        run: |
          set +e
          DRIVE_SCRIPT="/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py"
          DRIVE_NAME="$(basename "$REMOTE_PATH")_${{ github.run_id }}"
          if [ -n "$GREP_PATTERN" ]; then
            # S133: búsqueda de solo lectura en varios logs rotados a la
            # vez (zgrep lee también los .gz). El patrón viaja en base64
            # para no depender de comillas anidadas en el ssh.
            PATTERN_B64=$(printf '%s' "$GREP_PATTERN" | base64 -w0)
            GREP_OUT="/home/MiguelAeTxio/SWAP/file_grep_${{ github.run_id }}.txt"
            DRIVE_NAME="grep_${{ github.run_id }}.txt"
            ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
              "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; PATTERN=\$(echo '$PATTERN_B64' | base64 -d); for f in $REMOTE_PATH; do zgrep -H -E -- \"\$PATTERN\" \"\$f\" || true; done > '$GREP_OUT'; python -m dotenv run python3 '$DRIVE_SCRIPT' '$GREP_OUT' '$DRIVE_NAME' '${{ env.DRIVE_FOLDER_ID }}'; rm -f '$DRIVE_SCRIPT' '$GREP_OUT'" \
              > /tmp/result.txt 2>&1
            RC=$?
            echo "EXIT=$RC" >> /tmp/result.txt
            echo "DRIVE_NAME=$DRIVE_NAME" >> /tmp/result.txt
            cat /tmp/result.txt
            exit $RC
          fi
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; TARGET='$REMOTE_PATH'; if [ '$TAIL_LINES' != '0' ]; then TARGET=/home/MiguelAeTxio/SWAP/file_fetch_${{ github.run_id }}.txt; tail -n '$TAIL_LINES' '$REMOTE_PATH' > \"\$TARGET\"; fi; python -m dotenv run python3 '$DRIVE_SCRIPT' \"\$TARGET\" '$DRIVE_NAME' '${{ env.DRIVE_FOLDER_ID }}'; rm -f '$DRIVE_SCRIPT' /home/MiguelAeTxio/SWAP/file_fetch_${{ github.run_id }}.txt" \
            > /tmp/result.txt 2>&1
          RC=$?
          echo "EXIT=$RC" >> /tmp/result.txt
          echo "DRIVE_NAME=$DRIVE_NAME" >> /tmp/result.txt
          cat /tmp/result.txt
          # S135: el paso falla de verdad si falla el ssh
          # (com-actions-relay 4.2); antes salia verde siempre.
          if [ $RC -ne 0 ]; then
            echo "::error title=file_fetch::ssh salio con $RC"
          fi
          exit $RC

      - name: GCS — bajar a SWAP en el servidor y subirlo a Drive
        if: inputs.mode == 'gcs'
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
        run: |
          set +e
          BUCKET=$(printf '%s' "$REMOTE_PATH" | cut -d'/' -f1)
          BLOB=$(printf '%s' "$REMOTE_PATH" | cut -d'/' -f2-)
          TMP_PATH="/home/MiguelAeTxio/SWAP/file_fetch_${{ github.run_id }}"
          GCS_SCRIPT_PATH="/home/MiguelAeTxio/SWAP/gcs_fetch_${{ github.run_id }}.py"
          DRIVE_SCRIPT="/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py"
          DRIVE_NAME="$(basename "$REMOTE_PATH")_${{ github.run_id }}"
          scp -i ~/.ssh/pa_readonly_key .github/scripts/gcs_fetch.py \
            MiguelAeTxio@ssh.pythonanywhere.com:"$GCS_SCRIPT_PATH"
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; python -m dotenv run python3 '$GCS_SCRIPT_PATH' '$BUCKET' '$BLOB' '$TMP_PATH'; python -m dotenv run python3 '$DRIVE_SCRIPT' '$TMP_PATH' '$DRIVE_NAME' '${{ env.DRIVE_FOLDER_ID }}'; rm -f '$TMP_PATH' '$GCS_SCRIPT_PATH' '$DRIVE_SCRIPT'" \
            > /tmp/result.txt 2>&1
          RC=$?
          echo "EXIT=$RC" >> /tmp/result.txt
          echo "DRIVE_NAME=$DRIVE_NAME" >> /tmp/result.txt
          cat /tmp/result.txt
          # S135: el paso falla de verdad si falla el ssh
          # (com-actions-relay 4.2); antes salia verde siempre.
          if [ $RC -ne 0 ]; then
            echo "::error title=file_fetch::ssh salio con $RC"
          fi
          exit $RC

      # S117 (H30) -- modo gcs_text: en vez del archivo entero, SOLO el
      # texto de las 2 primeras páginas de uno o varios blobs, extraído
      # en el servidor con document_explorer.cloud_vision_service.
      # extract_text() (texto incrustado de PDF -> Cloud Vision, nunca
      # Tesseract local). El conector de Drive del modelo mete el
      # archivo completo en su contexto: un escaneo de cientos de KB no
      # cabe, su texto sí. Los blobs viajan en un archivo (uno por
      # línea) para no depender de comillas anidadas en el ssh.
      - name: GCS texto — extraer texto de varios blobs en el servidor y subirlo a Drive
        if: inputs.mode == 'gcs_text'
        env:
          REMOTE_PATH: ${{ inputs.remote_path }}
        run: |
          set +e
          printf '%s' "$REMOTE_PATH" | sed 's/ || /\n/g' > /tmp/targets.txt
          echo "Blobs pedidos: $(grep -c . /tmp/targets.txt)"
          TARGETS_PATH="/home/MiguelAeTxio/SWAP/gcs_text_targets_${{ github.run_id }}.txt"
          SCRIPT_PATH="/home/MiguelAeTxio/SWAP/gcs_text_extract_${{ github.run_id }}.py"
          OUT_PATH="/home/MiguelAeTxio/SWAP/gcs_text_${{ github.run_id }}.txt"
          DRIVE_SCRIPT="/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py"
          DRIVE_NAME="gcs_text_${{ github.run_id }}.txt"
          scp -i ~/.ssh/pa_readonly_key /tmp/targets.txt \
            MiguelAeTxio@ssh.pythonanywhere.com:"$TARGETS_PATH"
          scp -i ~/.ssh/pa_readonly_key .github/scripts/gcs_text_extract.py \
            MiguelAeTxio@ssh.pythonanywhere.com:"$SCRIPT_PATH"
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; python -m dotenv run python3 '$SCRIPT_PATH' '$OUT_PATH' 2500 '$TARGETS_PATH'; python -m dotenv run python3 '$DRIVE_SCRIPT' '$OUT_PATH' '$DRIVE_NAME' '${{ env.DRIVE_FOLDER_ID }}'; rm -f '$OUT_PATH' '$SCRIPT_PATH' '$TARGETS_PATH' '$DRIVE_SCRIPT'" \
            > /tmp/result.txt 2>&1
          RC=$?
          echo "EXIT=$RC" >> /tmp/result.txt
          echo "DRIVE_NAME=$DRIVE_NAME" >> /tmp/result.txt
          cat /tmp/result.txt
          # S135: el paso falla de verdad si falla el ssh
          # (com-actions-relay 4.2); antes salia verde siempre.
          if [ $RC -ne 0 ]; then
            echo "::error title=file_fetch::ssh salio con $RC"
          fi
          exit $RC

      # H30 (S119) -- modo gcs_image: el modelo necesita VER documentos
      # escaneados (el conector de Drive solo le da texto). Las primeras
      # páginas se renderizan a PNG en el servidor (PyMuPDF, render, no
      # OCR), se traen al runner y se publican como adjuntos de la
      # release PRIVADA "relevo-imagenes" (repo privado): el dominio de
      # esos adjuntos está en la red permitida del modelo, que los baja
      # a su entorno y los abre como imagen. Nunca un commit ni un
      # artifact (los artifacts no son descargables por el modelo, S112).
      - name: GCS imagen — renderizar páginas en el servidor y publicarlas en la release privada
        if: inputs.mode == 'gcs_image'
        env:
          IDS: ${{ inputs.remote_path }}
          DPI: ${{ inputs.dpi }}
          MAX_PAGES: ${{ inputs.max_pages }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RUN_DIR="/home/MiguelAeTxio/SWAP/gcs_image_${{ github.run_id }}"
          SCRIPT="/home/MiguelAeTxio/SWAP/gcs_render_${{ github.run_id }}.py"
          scp -i ~/.ssh/pa_readonly_key .github/scripts/gcs_render_pages.py \
            MiguelAeTxio@ssh.pythonanywhere.com:"$SCRIPT"
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; python -m dotenv run python3 '$SCRIPT' '$IDS' '$RUN_DIR' '$MAX_PAGES' '$DPI'" \
            | tee /tmp/result.txt
          mkdir -p /tmp/pages
          scp -i ~/.ssh/pa_readonly_key \
            MiguelAeTxio@ssh.pythonanywhere.com:"$RUN_DIR/*" /tmp/pages/
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "rm -rf '$RUN_DIR' '$SCRIPT' /home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py"
          gh release view relevo-imagenes >/dev/null 2>&1 || \
            gh release create relevo-imagenes --prerelease \
              --title "Relevo de imágenes (solo lectura, temporal)" \
              --notes "Páginas renderizadas por file_fetch.yml (modo gcs_image) para que el modelo las vea. Se vacía al cierre de sesión."
          gh release upload relevo-imagenes /tmp/pages/* --clobber
          echo "PUBLICADOS:" >> /tmp/result.txt
          ls /tmp/pages >> /tmp/result.txt

      # H30 (S119), uso puntual -- ver comentario del modo gcs_image arriba;
      # mismo mecanismo, aplicado a un único documento .rar de un caducable
      # sin fecha (id=8787): lo descomprime en el servidor y renderiza cada
      # miembro legible a PNG, para verlo igual que un documento suelto.
      - name: GCS rar — descomprimir en el servidor y publicar sus paginas en la release privada
        if: inputs.mode == 'gcs_unrar'
        env:
          ID: ${{ inputs.remote_path }}
          DPI: ${{ inputs.dpi }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RUN_DIR="/home/MiguelAeTxio/SWAP/gcs_unrar_${{ github.run_id }}"
          SCRIPT="/home/MiguelAeTxio/SWAP/gcs_unrar_${{ github.run_id }}.py"
          scp -i ~/.ssh/pa_readonly_key .github/scripts/gcs_unrar_peek.py \
            MiguelAeTxio@ssh.pythonanywhere.com:"$SCRIPT"
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; python -m dotenv run python3 '$SCRIPT' '$ID' '$RUN_DIR' 4 '$DPI'" \
            | tee /tmp/result.txt
          mkdir -p /tmp/pages
          scp -i ~/.ssh/pa_readonly_key \
            MiguelAeTxio@ssh.pythonanywhere.com:"$RUN_DIR/*" /tmp/pages/
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "rm -rf '$RUN_DIR' '$SCRIPT'"
          gh release view relevo-imagenes >/dev/null 2>&1 || \
            gh release create relevo-imagenes --prerelease \
              --title "Relevo de imágenes (solo lectura, temporal)" \
              --notes "Páginas renderizadas por file_fetch.yml para que el modelo las vea. Se vacía al cierre de sesión."
          gh release upload relevo-imagenes /tmp/pages/* --clobber
          echo "PUBLICADOS:" >> /tmp/result.txt
          ls /tmp/pages >> /tmp/result.txt

      - name: Resumen en el propio Action (no sensible -- solo nombres/estado)
        if: always()
        run: |
          {
            echo "## Descarga de archivo -> Drive"
            echo "**Modo:** ${{ inputs.mode }}  —  **Origen:** ${{ inputs.remote_path }}"
            echo '```'
            cat /tmp/result.txt 2>/dev/null || echo "(sin salida -- ver pasos anteriores)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar clave SSH
        if: always()
        run: rm -f ~/.ssh/pa_readonly_key
