# /home/MiguelAeTxio/PROJECTS/EnterpriseBot/.github/workflows/test_drive_folder.yml
name: PRUEBA — Crear carpeta de Drive desde el servidor (H31, S112)

# Prueba de una sola vez para verificar si una carpeta creada por el
# servidor (OAuth drive.file, gdrive_service.get_drive_service()) es
# visible desde el conector de Google Drive del modelo -- misma cuenta
# (nummenor@gmail.com), scope distinto. Se borra tras la prueba, junto
# con .github/scripts/drive_folder_test.py.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar clave SSH dedicada (solo lectura, misma que db_query.yml)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_DB_READONLY_SSH_PRIVATE_KEY }}" > ~/.ssh/pa_readonly_key
          chmod 600 ~/.ssh/pa_readonly_key
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: Subir el script y ejecutarlo en el servidor
        run: |
          set +e
          SCRIPT_PATH="/home/MiguelAeTxio/SWAP/drive_folder_test_${{ github.run_id }}.py"
          scp -i ~/.ssh/pa_readonly_key .github/scripts/drive_folder_test.py \
            MiguelAeTxio@ssh.pythonanywhere.com:"$SCRIPT_PATH"
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; python -m dotenv run python3 '$SCRIPT_PATH'; rm -f '$SCRIPT_PATH'" \
            > /tmp/result.txt 2>&1
          echo "EXIT=$?" >> /tmp/result.txt
          cat /tmp/result.txt

      - name: "Comitear el resultado (no sensible, solo un id de carpeta)"
        if: always()
        run: |
          mkdir -p DOCS/SESSION/FILE_FETCH
          cp /tmp/result.txt DOCS/SESSION/FILE_FETCH/drive_test_result.txt
          git config user.email "miguelaetxio@users.noreply.github.com"
          git config user.name "MiguelaeTxio"
          git add DOCS/SESSION/FILE_FETCH/drive_test_result.txt
          git diff --staged --quiet || git commit -m "chore: prueba de carpeta Drive desde servidor (run ${{ github.run_id }})"
          git push

      - name: Limpiar clave SSH
        if: always()
        run: rm -f ~/.ssh/pa_readonly_key
