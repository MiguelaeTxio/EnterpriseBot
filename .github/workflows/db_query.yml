# /home/MiguelAeTxio/PROJECTS/EnterpriseBot/.github/workflows/db_query.yml
name: Consulta SQL de solo lectura (EnterpriseBot)

# H35 (S107, migrado a Drive en S112 -- ver com-actions-relay).
# Disparado a mano por Claude (workflow_dispatch) via la API de GitHub
# -- api.github.com si esta permitida en el sandbox de cualquier
# sesion, ssh.pythonanywhere.com/el host de MySQL no. Este workflow
# corre en un runner de GitHub (red completa, sin ninguna restriccion),
# abre una sesion SSH directa a PythonAnywhere con una clave dedicada
# de solo este proposito (nunca la clave personal de Miguel Angel ni
# la de deploy.yml) y ejecuta el SQL recibido contra MySQL.
#
# S112: el resultado YA NO se comitea a git -- se sube a la carpeta de
# Drive "EnterpriseBot - Intercambio Claude" (id fijo abajo) con la
# credencial OAuth ya configurada del proyecto
# (spare_parts.gdrive_service). Origen: purga real de ~150 commits
# históricos con datos de personas tras exponer un contrato real vía
# el mecanismo hermano file_fetch.yml -- ver com-actions-relay. El
# resumen del propio Action (GITHUB_STEP_SUMMARY) tampoco imprime ya el
# resultado real -- ese resumen persiste mientras dure la retención de
# Actions, mismo problema de exposición si el repo se hace público.
#
# SEGURIDAD REAL (S107, confirmado contra documentacion oficial de
# PythonAnywhere): NINGUN plan permite CREATE USER a nivel de MySQL,
# asi que no existe un usuario de solo lectura dedicado -- se usa el
# unico usuario real (`MiguelAeTxio`, con permisos completos). La
# proteccion real de que esto siga siendo de solo lectura vive en DOS
# sitios, ninguno de los cuales es el usuario:
#   1. Validacion de texto (paso "Validar...") -- la consulta debe
#      empezar por SELECT/SHOW/DESCRIBE/EXPLAIN, una sola sentencia,
#      sin INTO OUTFILE/DUMPFILE/LOAD_FILE.
#   2. `SET SESSION TRANSACTION READ ONLY;` inyectado por el propio
#      workflow (nunca por el input del usuario) como primera
#      sentencia de la MISMA sesion MySQL que la consulta.
#
# NUNCA sustituye a un Comando S cuando la operacion necesita pasar
# por logica real de Django -- esto es solo para lecturas SQL puras.
#
# H35 (S108). `mysql --table` fallaba de forma intermitente con texto
# OCR real -- cambiado a `--batch --raw` (TSV simple). La salida es
# columnas separadas por tabulador con una fila de cabecera.

on:
  workflow_dispatch:
    inputs:
      sql_query:
        description: "Consulta SQL de solo lectura (SELECT/SHOW/DESCRIBE unicamente)"
        required: true
        type: string

env:
  DRIVE_FOLDER_ID: "1SSHSY2FHt-7eN17Wgza2Qcybs-ij6to0"

concurrency:
  group: enterprisebot-db-readonly-query
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar que la consulta es de solo lectura
        env:
          SQL_QUERY: ${{ inputs.sql_query }}
        run: |
          TRIMMED=$(printf '%s' "$SQL_QUERY" | sed -E 's/^[[:space:]]+//' | tr '[:lower:]' '[:upper:]')
          if ! printf '%s' "$TRIMMED" | grep -qE '^(SELECT|SHOW|DESCRIBE|DESC|EXPLAIN)([[:space:]]|$)'; then
            echo "⛔ RECHAZADO: la consulta no empieza por SELECT/SHOW/DESCRIBE/EXPLAIN." >&2
            exit 1
          fi
          BODY=$(printf '%s' "$SQL_QUERY" | sed -E 's/;[[:space:]]*$//')
          if printf '%s' "$BODY" | grep -q ';'; then
            echo "⛔ RECHAZADO: no se permite más de una sentencia por consulta." >&2
            exit 1
          fi
          if printf '%s' "$TRIMMED" | grep -qE 'INTO[[:space:]]+(OUTFILE|DUMPFILE)|LOAD_FILE[[:space:]]*\('; then
            echo "⛔ RECHAZADO: acceso a archivo del servidor (OUTFILE/DUMPFILE/LOAD_FILE) no permitido." >&2
            exit 1
          fi
          echo "Consulta validada, primera palabra: $(printf '%s' "$TRIMMED" | awk '{print $1}')"

      - name: Preparar clave SSH dedicada (solo lectura)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_DB_READONLY_SSH_PRIVATE_KEY }}" > ~/.ssh/pa_readonly_key
          chmod 600 ~/.ssh/pa_readonly_key
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: Ejecutar la consulta en PythonAnywhere (sesión bloqueada a solo lectura por el propio servidor)
        env:
          SQL_QUERY: ${{ inputs.sql_query }}
          DB_ADMIN_PASSWORD: ${{ secrets.PA_DB_ADMIN_PASSWORD }}
        run: |
          set -o pipefail
          {
            echo "SET SESSION TRANSACTION READ ONLY;"
            printf '%s\n' "$SQL_QUERY"
          } > /tmp/query.sql
          scp -i ~/.ssh/pa_readonly_key /tmp/query.sql \
            MiguelAeTxio@ssh.pythonanywhere.com:/tmp/db_readonly_query_${{ github.run_id }}.sql
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com "
            set -e
            mysql -u 'MiguelAeTxio' -p'$DB_ADMIN_PASSWORD' \
              -h MiguelAeTxio.mysql.pythonanywhere-services.com \
              --batch --raw 'MiguelAeTxio\$enterprisebot' \
              < /tmp/db_readonly_query_${{ github.run_id }}.sql
            rm -f /tmp/db_readonly_query_${{ github.run_id }}.sql
          " | tee /tmp/query_output.txt

      - name: Subir el resultado a Drive (nunca a git -- com-actions-relay)
        if: always()
        run: |
          set +e
          : > /tmp/debug.txt
          {
            echo "# Resultado de consulta SQL de solo lectura"
            echo ""
            echo "**Ejecutada:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Run:** ${{ github.run_id }}"
            echo ""
            echo "### Consulta"
            echo '```sql'
            printf '%s\n' "${{ inputs.sql_query }}"
            echo '```'
            echo ""
            echo "### Resultado"
            echo '```'
            cat /tmp/query_output.txt 2>/dev/null || echo "(sin salida capturada -- revisar el log del Action)"
            echo '```'
          } > /tmp/resultado.md
          DRIVE_NAME="resultado_sql_${{ github.run_id }}.md"
          scp -i ~/.ssh/pa_readonly_key /tmp/resultado.md \
            MiguelAeTxio@ssh.pythonanywhere.com:/home/MiguelAeTxio/SWAP/resultado_${{ github.run_id }}.md 2> /tmp/scp1_err.txt
          echo "SCP1_EXIT=$?" >> /tmp/debug.txt
          cat /tmp/scp1_err.txt >> /tmp/debug.txt
          scp -i ~/.ssh/pa_readonly_key .github/scripts/drive_upload.py \
            MiguelAeTxio@ssh.pythonanywhere.com:/home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py 2> /tmp/scp2_err.txt
          echo "SCP2_EXIT=$?" >> /tmp/debug.txt
          cat /tmp/scp2_err.txt >> /tmp/debug.txt
          ssh -i ~/.ssh/pa_readonly_key MiguelAeTxio@ssh.pythonanywhere.com \
            "set -e; cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot; source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate; export PYTHONPATH=/home/MiguelAeTxio/PROJECTS/EnterpriseBot; python -m dotenv run python3 /home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py /home/MiguelAeTxio/SWAP/resultado_${{ github.run_id }}.md '$DRIVE_NAME' '${{ env.DRIVE_FOLDER_ID }}'; rm -f /home/MiguelAeTxio/SWAP/resultado_${{ github.run_id }}.md /home/MiguelAeTxio/SWAP/drive_upload_${{ github.run_id }}.py" \
            > /tmp/drive_result.txt 2> /tmp/ssh_err.txt
          echo "SSH_EXIT=$?" >> /tmp/debug.txt
          echo "--- SSH STDOUT ---" >> /tmp/debug.txt
          cat /tmp/drive_result.txt >> /tmp/debug.txt
          echo "--- SSH STDERR ---" >> /tmp/debug.txt
          cat /tmp/ssh_err.txt >> /tmp/debug.txt
          echo "DRIVE_NAME=$DRIVE_NAME" >> /tmp/debug.txt
          cat /tmp/debug.txt

      - name: Resumen en el propio Action (sin datos reales -- solo estado y depuración)
        if: always()
        run: |
          {
            echo "## Consulta SQL de solo lectura"
            echo "Resultado subido a Drive, no impreso aquí -- ver com-actions-relay."
            echo '```'
            cat /tmp/debug.txt 2>/dev/null || echo "(sin datos de depuración -- ver pasos anteriores)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar clave SSH
        if: always()
        run: rm -f ~/.ssh/pa_readonly_key
