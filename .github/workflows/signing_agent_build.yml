name: Agente de firmas (Windows) -- compilar el .exe

# S153. Construye AgenteFirmas.exe (signing_agent/agente_firmas.py) en un
# runner Windows -- la plataforma de destino, donde también se compila el
# candado con pip-tools (com-environment-management 3.4) -- y lo sube a la
# release "agente-firmas" del repositorio, de donde se descarga para
# instalarlo en el ordenador con los certificados.

on:
  push:
    branches: [main]
    paths:
      - 'signing_agent/**'
      - '.github/workflows/signing_agent_build.yml'
  workflow_dispatch:

concurrency:
  group: signing-agent-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilar el candado e instalar (pip-tools)
        working-directory: signing_agent
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --quiet requirements.in -o requirements.txt
          pip-sync requirements.txt
          type requirements.txt

      - name: Probar la firma nativa (certificados de prueba CNG y CryptoAPI)
        working-directory: signing_agent
        shell: pwsh
        run: |
          $cng = New-SelfSignedCertificate -Subject "CN=PRUEBA CNG (R: B00000000), O=PRUEBA SL, C=ES" -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048 -KeyExportPolicy NonExportable -HashAlgorithm SHA256
          $capi = New-SelfSignedCertificate -Subject "CN=PRUEBA CAPI (R: B00000001), O=PRUEBA SL, C=ES" -CertStoreLocation Cert:\CurrentUser\My -Provider "Microsoft Enhanced Cryptographic Provider v1.0" -KeySpec Signature -KeyLength 2048 -KeyExportPolicy NonExportable -HashAlgorithm SHA256
          python prueba_firma_nativa.py $cng.Thumbprint $capi.Thumbprint
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Empaquetar (PyInstaller)
        working-directory: signing_agent
        run: |
          pyinstaller --onefile --noconsole --name AgenteFirmas --hidden-import firma_nativa --collect-all pyhanko --collect-all pyhanko_certvalidator --collect-all uharfbuzz --collect-data fontTools agente_firmas.py
          dir dist

      - name: Publicar en la release agente-firmas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view agente-firmas >/dev/null 2>&1; then
            gh release create agente-firmas --title "Agente de firmas (Windows)" \
              --notes "AgenteFirmas.exe: agente de firma digital (pestaña Firmas del panel). Se actualiza solo en cada cambio de signing_agent/."
          fi
          cp signing_agent/requirements.txt signing_agent/dist/requirements-agente-firmas.txt
          gh release upload agente-firmas signing_agent/dist/AgenteFirmas.exe \
            signing_agent/dist/requirements-agente-firmas.txt --clobber
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: agente-firmas (AgenteFirmas.exe)" >> "$GITHUB_STEP_SUMMARY"
