name: Deploy EnterpriseBot to PythonAnywhere

# Despliegue automatico completo (S013, ampliado en S014). Se dispara
# en cada push a main. Hace, en este orden: git pull en el servidor
# via SSH, migrate --noinput, collectstatic --noinput --clear, reload
# de la web app via API de PythonAnywhere, y reinicio CONDICIONAL de
# las Always-on Tasks de EnterpriseBot (bridge de voz id 270439,
# worker Celery id 270440) solo cuando el diff del push toca archivos
# relevantes para cada una -- ver el paso "Detectar archivos
# cambiados" para el patron exacto. Nunca corre makemigrations (los
# archivos de migracion se generan y revisan siempre en el workspace
# de Claude antes de pushear, nunca en el servidor -- ver
# com-migrations seccion 1).
#
# ⛔ INCIDENTE REAL S102: un push que toca `requirements.in` dispara
# este workflow Y `compile-requirements.yml` a la vez (ese otro no
# tiene filtro de rama compartido, solo de ruta) -- las dos sesiones
# SSH hacían `git pull origin main` contra el MISMO checkout del
# servidor casi al mismo tiempo, y `compile-requirements.yml` chocó
# con un estado a medio actualizar ("fatal: Need to specify how to
# reconcile divergent branches"). Nunca dejó el repositorio realmente
# corrupto (confirmado con `git log` real tras el incidente: HEAD
# local y origin/main coincidian exactamente), pero es una condicion
# de carrera real entre dos workflows tocando el mismo servidor a la
# vez. Corregido con el `concurrency:` de abajo, mismo grupo que
# `compile-requirements.yml` -- GitHub encola las sesiones SSH en vez
# de dejarlas pisarse.

on:
  push:
    branches: [main]

concurrency:
  group: enterprisebot-pythonanywhere-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar clave SSH dedicada
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PA_SSH_PRIVATE_KEY }}" > ~/.ssh/pa_deploy_key
          chmod 600 ~/.ssh/pa_deploy_key
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

      - name: git pull + migrate + collectstatic en PythonAnywhere
        # BUGFIX S014 (2026-07-13): "ssh ... | tee archivo" enmascaraba
        # el código de salida real del ssh -- sin pipefail, el exit
        # status de la tubería es el de `tee` (que casi siempre es 0),
        # no el de `ssh`. Esto hizo que DOS despliegues seguidos
        # (commits 9bb32ee y ea70dcd) se reportaran en verde en GitHub
        # Actions mientras el `git pull` real fallaba en el servidor
        # con "untracked working tree files would be overwritten by
        # merge" -- el código nunca llegó a producción pese al "✅".
        # `set -o pipefail` en el shell EXTERIOR de la Action (no basta
        # con el `set -e` de dentro del script remoto de ssh, que solo
        # afecta a la sesión ssh en sí) hace que el exit code de toda
        # la tubería sea el del primer comando que falle -- ahora un
        # fallo real del ssh sí tumba este step, y los steps
        # siguientes sin `if: always()` se saltan automáticamente.
        #
        # S014 (ampliación): también captura OLD_HEAD/NEW_HEAD y
        # vuelca la lista de archivos cambiados entre marcadores
        # (CHANGED_FILES_START/END) -- el step siguiente la usa para
        # decidir si reiniciar el bridge de voz y/o el worker Celery.
        # BUGFIX S94 (2026-09-07): la migración de venv de H32/S93
        # (Python 3.10 -> 3.12, EnterpriseBot_venv ->
        # EnterpriseBot_venv_py312) actualizó start_celery_worker.sh
        # (commit 7ae950f) pero dejó este workflow apuntando al venv
        # antiguo -- desde entonces TODO despliegue automático fallaba
        # en este mismo paso con ModuleNotFoundError (celery y
        # cualquier otra dependencia instalada solo en el venv nuevo),
        # detectado al desplegar hr_calendar.MedicalLeavePeriod (H31,
        # S94) y confirmado con Comando S real
        # (EnterpriseBot_002_GET.txt / EnterpriseBot_003_GET.txt: la
        # ruta antigua ya no existe, `ls .virtualenvs` solo lista
        # EnterpriseBot_venv_py312).
        #
        # PASO "pip-sync" AÑADIDO EN S100 (H31, google-cloud-vision):
        # antes de este cambio, una dependencia nueva declarada en
        # requirements.in/.txt requería que Miguel Ángel ejecutara
        # `pip-compile`/`pip-sync` a mano en la consola de
        # PythonAnywhere -- y eso mismo ya causó un incidente real
        # documentado (anexo H23, S023): `pip-compile` ejecutado en el
        # servidor reescribe `requirements.txt` en el árbol de trabajo
        # SIN comitear, dejando una modificación local que bloquea el
        # siguiente `git pull` de este mismo Action (dos despliegues
        # reales en rojo por esto). Corregido de raíz: el candado
        # (`requirements.txt`) se compila SIEMPRE fuera del servidor
        # (workspace de Claude o local de Miguel Ángel, nunca en
        # PythonAnywhere) y se comitea normal; este Action es el único
        # que instala de verdad en el servidor, vía `pip-sync`
        # (entorno idéntico al candado, nunca deja paquetes sueltos
        # sin declarar) -- sin tocar el árbol de trabajo del servidor
        # en ningún momento, así que nunca puede bloquear el pull
        # siguiente. Idempotente: si no hay dependencias nuevas, no
        # cambia nada.
        # ⛔ CORREGIDO EN S100, INCIDENTE REAL (mismo día): un fallo de
        # `pip-sync` (red, resolución, lo que sea) abortaba con `set
        # -e` TODO el resto del bloque -- incluido el `git pull` que
        # ya se había ejecutado con éxito -- y como el siguiente paso
        # ("Recargar la web app") solo corre `if: success()`, la
        # recarga NUNCA se disparaba. Resultado real: el código
        # corregido llegó al disco del servidor (confirmado con
        # Comando S, `git log`/`grep` sobre el archivo real), pero el
        # proceso web en memoria siguió sirviendo la versión vieja
        # indefinidamente -- Miguel Ángel probando el mismo fix una y
        # otra vez sin que cambiara nada, con razón. `|| { ...; }`
        # aquí: un fallo de pip-sync se registra fuerte en el resumen
        # pero NUNCA impide que migrate/collectstatic/reload
        # continúen -- código nuevo sin una dependencia nueva
        # instalada es un fallo visible (ImportError, logueado) y
        # mucho mejor que todo el despliegue congelado en silencio.
        run: |
          set -o pipefail
          ssh -i ~/.ssh/pa_deploy_key MiguelAeTxio@ssh.pythonanywhere.com '
            set -e
            cd /home/MiguelAeTxio/PROJECTS/EnterpriseBot
            OLD_HEAD=$(git rev-parse HEAD)
            echo "--- git pull ---"
            git pull origin main
            NEW_HEAD=$(git rev-parse HEAD)
            source /home/MiguelAeTxio/.virtualenvs/EnterpriseBot_venv_py312/bin/activate
            echo "--- pip-sync (dependencias) ---"
            python -m dotenv run pip-sync requirements.txt || {
              echo "⛔ pip-sync FALLO -- revisar manualmente, pero migrate/collectstatic/reload SIGUEN adelante.";
            }
            echo "--- migrate ---"
            python -m dotenv run python manage.py migrate --noinput
            echo "--- collectstatic ---"
            python -m dotenv run python manage.py collectstatic --noinput --clear
            echo "--- CHANGED_FILES_START ---"
            git diff --name-only "$OLD_HEAD" "$NEW_HEAD"
            echo "--- CHANGED_FILES_END ---"
          ' | tee /tmp/deploy_output.txt

      - name: Recargar la web app (API PythonAnywhere)
        # Explícito tras el bugfix de arriba: si el paso anterior
        # falla de verdad ahora (ya no se enmascara), este NUNCA debe
        # ejecutarse con código a medio desplegar -- if: success() es
        # el comportamiento por defecto de GitHub Actions, se deja
        # explícito aquí para que quede claro que es intencional.
        #
        # --max-time 60 (S026, Miguel Ángel): el reload de PythonAnywhere
        # puede tardar hasta 45s cuando hay mucho tráfico en la
        # plataforma -- sin este flag, curl usaba su comportamiento por
        # defecto (sin límite explícito de tiempo total), y varios
        # despliegues reales fallaron ("git pull + migrate +
        # collectstatic" en éxito, este paso en fallo) exactamente por
        # eso. Confirmado por Miguel Ángel: "el error es única y
        # exclusivamente por el tema del timeout" -- puede reiniciar la
        # web app a mano desde el botón verde del panel de PythonAnywhere
        # cuando pasa. Un minuto de margen, por encima de los 45s reales
        # observados.
        if: success()
        run: |
          curl -sf --max-time 60 -X POST \
            "https://www.pythonanywhere.com/api/v0/user/MiguelAeTxio/webapps/enterprisebot-miguelaetxio.pythonanywhere.com/reload/" \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}"
          echo "--- Reload solicitado OK ---"

      - name: Reiniciar Always-on Tasks si el push las afecta (S014)
        # Reutiliza el mismo secret PA_API_TOKEN que ya usa el paso de
        # reload de arriba -- un token de API de PythonAnywhere es a
        # nivel de cuenta, no hace falta uno nuevo por endpoint.
        #
        # IDs reales de las Always-on Tasks de EnterpriseBot
        # (confirmados vía API en S014 -- las otras dos tareas de la
        # cuenta, 182748 y 209547, son de Campus Studio Online, nunca
        # tocarlas desde aquí):
        #   270439 -- Bridge de Voz Conversacional (voice_orchestrator.py)
        #   270440 -- Worker Celery (procesamiento de partes de trabajo PDF)
        #
        # ⛔ CORREGIDO S97, INCIDENTE REAL: los IDs de esta sección
        # llevaban desde S014 apuntando a 234987/242133. En algún
        # momento esas dos Always-on Tasks se borraron y recrearon
        # (motivo no determinado -- no quedó registro escrito de
        # cuándo ni por qué), y PythonAnywhere les asignó IDs nuevos.
        # Nadie actualizó este workflow. Consecuencia real: todo
        # despliegue que tocara `document_explorer/` (o cualquier otro
        # patrón de Celery) desde entonces fallaba en este mismo paso
        # con "Task does not exist" (404) -- el `curl -sf` lo
        # reportaba como fallo del job (exit 22), pero sin cuerpo de
        # respuesta visible en el resumen, así que pasó desapercibido
        # varias sesiones. Diagnosticado en S97 con una llamada real
        # a `GET /always_on/` (no adivinando): devolvió 270439/270440
        # como los IDs reales y en estado `Running`. IDs corregidos
        # aquí y en `SESSION_VARIABLES.md`/`ENTERPRISEBOT_MASTER_DOCUMENT.md`.
        # Pendiente sin resolver: no hay ninguna alerta que avise si
        # esto vuelve a pasar -- un 404 aquí sigue siendo silencioso
        # salvo que alguien mire el resumen del Action a propósito.
        #
        # Patrones de disparo, decididos con Miguel Ángel en S014:
        #   S133: el núcleo de alta de servicios (budgets/service_intake.py
        #   y lo que usa: assistance_traffic, models, forms_services,
        #   tirea_extraction) corre dentro del bridge (llamada) y del
        #   worker Celery (WhatsApp): reinicia los dos.
        #   Bridge -- vox_bridge/**, voice_orchestrator.py,
        #             voice_sidecar_bridge.py, ivr_config/services.py,
        #             y (AMPLIADO S025, hallazgo real) whatsapp/** --
        #             vox_bridge/services.py importa whatsapp.services
        #             (send_capture_notification, send_template,
        #             send_quick_reply) con imports locales dentro de
        #             funciones; Python cachea el módulo tras la
        #             primera importación del proceso, así que un fix
        #             en whatsapp/services.py no llega al bridge en
        #             ejecución sin reiniciarlo. NUNCA reiniciar el
        #             bridge sin confirmar antes con Miguel Ángel --
        #             corta llamadas IVR en curso.
        #   Celery -- cualquier tasks.py del proyecto, ai_services/**
        #             (cliente Gemini compartido usado por las tareas),
        #             enterprise_core/celery.py, start_celery_worker.sh,
        #             y (AMPLIADO S025, hallazgo real -- ver más abajo)
        #             machine_documents/**, personal_documents/**,
        #             document_ingestion/**, document_management/**,
        #             spare_parts/gcs_service.py, y (AMPLIADO S040,
        #             mismo patrón de incidente, ver más abajo)
        #             document_explorer/**.
        #
        # ⛔ INCIDENTE S025: el patrón original solo cubría tasks.py y
        # ai_services/, pero machine_documents.tasks/document_ingestion.
        # tasks/personal_documents.tasks importan de verdad módulos de
        # document_management/ (alert_service.py, vigencia_service.py,
        # models.py), document_ingestion/ (entity_matching_service.py,
        # deduplication_service.py) y spare_parts/gcs_service.py -- un
        # fix real en document_management/alert_service.py (S025, no
        # crear alertas de documentos ya caducados) se desplegó al
        # servidor (git pull correcto, verificado) pero el worker
        # Celery NUNCA se reinició porque ningún patrón lo cubría --
        # el proceso en memoria siguió ejecutando la versión vieja
        # durante varias pruebas reales, hasta que Miguel Ángel
        # reportó con datos que las alertas de documentos caducados
        # seguían creándose pese al fix ya desplegado. Patrón
        # ampliado a las carpetas completas de dominio, no solo a
        # tasks.py, para que esto no vuelva a pasar con ningún otro
        # módulo que esas tareas importen.
        #
        # ⛔ INCIDENTE S040 (mismo patrón exacto que S025, repetido):
        # document_explorer.tasks.classify_entries_task (H29, añadida
        # en este mismo hito) importa
        # document_explorer/classification_service.py, que no vive en
        # tasks.py ni en ninguna de las carpetas ya cubiertas. Un fix
        # real (conversión de Office a PDF con LibreOffice antes de
        # clasificar) se desplegó al servidor (git pull correcto,
        # verificado con `git log -1`) pero el worker Celery siguió
        # con el proceso viejo en memoria -- confirmado con la cola
        # real del log del worker, sin ninguna línea de arranque nueva
        # tras el push. Miguel Ángel reprodujo el mismo .docx y siguió
        # dando el error de mimeType antiguo pese al fix ya
        # desplegado. `document_explorer/` entero añadido al patrón,
        # no solo `classification_service.py`, por el mismo motivo que
        # S025: cualquier módulo de esa app que `tasks.py` importe hoy
        # o en el futuro debe disparar el reinicio.
        if: success()
        run: |
          set -o pipefail
          CHANGED=$(sed -n '/--- CHANGED_FILES_START ---/,/--- CHANGED_FILES_END ---/p' /tmp/deploy_output.txt | sed '1d;$d')
          FAILED=0
          {
            echo "Archivos cambiados en este despliegue:"
            echo "$CHANGED"
            echo ""

            # H31 (S97, corregido tras incidente real). Antes: `curl -sf`
            # silenciaba el cuerpo de la respuesta en cuanto la API
            # devolvia un error -- el 404 real de "Task does not exist"
            # (IDs obsoletos, ver comentario de mas arriba) solo se veia
            # como un opaco "exit code 22", sin decir NUNCA cual era el
            # error real ni que endpoint habia fallado. Sin `-f`: se
            # captura siempre el codigo HTTP y el cuerpo por separado, se
            # imprimen los dos SIEMPRE (exito o fallo), y solo se marca
            # FAILED (que hace fallar el step al final, tras haber
            # intentado las dos tareas) si el codigo no es 2xx -- el
            # resumen del Action vuelve a contar la verdad completa por
            # si sola, sin depender de que alguien relance un curl manual
            # para averiguar que paso.
            if echo "$CHANGED" | grep -qE '^(vox_bridge/|voice_orchestrator\.py|voice_sidecar_bridge\.py|ivr_config/services\.py|whatsapp/services\.py|whatsapp/models\.py|budgets/(service_intake|assistance_traffic|models|forms_services|tirea_extraction)\.py)'; then
              echo "--- Bridge de voz: cambios relevantes detectados, reiniciando (id 270439) ---"
              RESP=$(curl -s --max-time 60 -w "\nHTTP_STATUS:%{http_code}" -X POST "https://www.pythonanywhere.com/api/v0/user/MiguelAeTxio/always_on/270439/restart/" \
                -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}")
              echo "$RESP"
              STATUS=$(echo "$RESP" | grep -oE "HTTP_STATUS:[0-9]+" | cut -d: -f2)
              if [ "${STATUS:0:1}" = "2" ]; then
                echo "Bridge de voz: reinicio solicitado OK."
              else
                echo "⛔ Bridge de voz: FALLO real (HTTP $STATUS) -- ver cuerpo de la respuesta arriba."
                FAILED=1
              fi
            else
              echo "Bridge de voz: sin cambios relevantes, no se reinicia."
            fi

            if echo "$CHANGED" | grep -qE '(tasks\.py$|budgets/(service_intake|assistance_traffic|models|forms_services|tirea_extraction)\.py|ai_services/|enterprise_core/celery\.py|enterprise_core/settings\.py|start_celery_worker\.sh|machine_documents/|personal_documents/|document_ingestion/|document_management/|document_explorer/|spare_parts/gcs_service\.py|spare_parts/services\.py)'; then
              echo "--- Worker Celery: cambios relevantes detectados, reiniciando (id 270440) ---"
              RESP=$(curl -s --max-time 60 -w "\nHTTP_STATUS:%{http_code}" -X POST "https://www.pythonanywhere.com/api/v0/user/MiguelAeTxio/always_on/270440/restart/" \
                -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}")
              echo "$RESP"
              STATUS=$(echo "$RESP" | grep -oE "HTTP_STATUS:[0-9]+" | cut -d: -f2)
              if [ "${STATUS:0:1}" = "2" ]; then
                echo "Worker Celery: reinicio solicitado OK."
              else
                echo "⛔ Worker Celery: FALLO real (HTTP $STATUS) -- ver cuerpo de la respuesta arriba."
                FAILED=1
              fi
            else
              echo "Worker Celery: sin cambios relevantes, no se reinicia."
            fi
          } | tee /tmp/restart_output.txt
          if [ "$FAILED" = "1" ]; then
            echo "⛔ Al menos un reinicio de Always-on Task fallo de verdad -- ver 'Resumen del despliegue' para el cuerpo real de la respuesta." >&2
            exit 1
          fi

      - name: Resumen del despliegue (mantener informado a Miguel Angel)
        # BUGFIX S014 (2026-07-13, segunda parte): interpolar
        # ${{ github.event.head_commit.message }} directamente dentro
        # del texto del script (echo "...${{ }}...") rompe en cuanto el
        # mensaje del commit tiene varias líneas, comillas, paréntesis
        # o la palabra EOF -- GitHub sustituye ${{ }} como texto plano
        # ANTES de que bash lo ejecute, así que un mensaje de commit
        # largo (como el propio commit de cierre de esta sesión) puede
        # corromper el script generado y hacer fallar el step entero
        # (visto en vivo: "line 100: ...: No such file or directory").
        # Solución estándar: pasar el valor vía `env:` (el runner lo
        # expone como variable de entorno normal, sin interpolación de
        # texto) y referenciarlo como "$COMMIT_MESSAGE" dentro del
        # script -- inmune al contenido, cite lo que cite.
        if: always()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Despliegue EnterpriseBot -- $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Mensaje (primera línea):** $(printf '%s' "$COMMIT_MESSAGE" | head -1)"
            echo ""
            echo "### Salida del servidor"
            echo '```'
            cat /tmp/deploy_output.txt 2>/dev/null || echo "(sin salida capturada -- revisar el paso anterior)"
            echo '```'
            if grep -q "No migrations to apply" /tmp/deploy_output.txt 2>/dev/null; then
              echo ""
              echo "Sin migraciones nuevas aplicadas en este despliegue."
            else
              echo ""
              echo "**Atencion: puede haberse aplicado una migracion nueva -- revisar la salida de arriba.**"
            fi
            echo ""
            echo "### Always-on Tasks (bridge de voz / worker Celery)"
            echo '```'
            cat /tmp/restart_output.txt 2>/dev/null || echo "(sin ejecutar -- revisar el paso anterior)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar clave SSH
        if: always()
        run: rm -f ~/.ssh/pa_deploy_key
