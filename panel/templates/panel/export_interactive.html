{# S153: exportación a HTML interactiva (panel/export_html.py). #}
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Exportación interactiva de EnterpriseBot">
<meta name="keywords" content="EnterpriseBot, exportación">
<title>{{ title }}</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1c2533;--muted:#6b778a;--line:#e3e9f2;
--brand:#1f4e78;--brand2:#2f80c8;--band:#f6f9fd;--hover:#e8f1fc;--chip:#eef4fb;
--mark:#ffe58a;--shadow:0 6px 24px rgba(20,40,80,.08)}
body.dark{--bg:#0f1520;--card:#18212f;--ink:#e6ecf5;--muted:#93a1b5;--line:#2a3646;
--brand:#4f9be6;--brand2:#7ab8f5;--band:#1c2635;--hover:#22324a;--chip:#223146;
--mark:#8a6d00;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);
color:var(--ink);font-size:14px;transition:background .2s,color .2s}
header{background:linear-gradient(120deg,#163a5c,#1f4e78 45%,#2f80c8);color:#fff;
padding:22px 28px 54px}
header h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.2px}
header .sub{opacity:.85;font-size:13px;margin-top:4px}
main{max-width:1600px;margin:-38px auto 28px;padding:0 20px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 12px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);padding:9px 14px;border-radius:10px 10px 0 0;
cursor:pointer;font-weight:600;font-size:13px}
.tab.on{background:var(--chip);color:var(--brand)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;
border-bottom:1px solid var(--line)}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
background:var(--bg);color:var(--ink);font-size:14px;outline:none}
.search input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,128,200,.18)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;
border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;gap:6px;
align-items:center}
.btn:hover{border-color:var(--brand2);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.menu{position:relative}
.drop{display:none;position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--line);
border-radius:12px;box-shadow:var(--shadow);padding:8px;z-index:20;max-height:360px;overflow:auto;
min-width:240px}
.drop.open{display:block}
.drop label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;cursor:pointer;
font-size:13px}
.drop label:hover{background:var(--hover)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.chip{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:700;margin-left:4px}
.titles{padding:10px 16px 0;color:var(--muted);font-size:13px}
.wrap{overflow:auto;max-height:calc(100vh - 230px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--brand);color:#fff;text-align:left;font-weight:600;
padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
thead tr.f th{top:39px;background:var(--chip);padding:6px 8px;cursor:default;z-index:2}
thead tr.f input{width:100%;min-width:70px;padding:5px 8px;border:1px solid var(--line);
border-radius:7px;background:var(--card);color:var(--ink);font-size:12px}
th .arrow{opacity:.45;margin-left:6px;font-size:11px}
th.sorted .arrow{opacity:1}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--band)}
tbody tr:hover td{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{position:sticky;bottom:0;background:var(--chip);font-weight:700;padding:10px 12px;
border-top:2px solid var(--brand)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 26px}
@media print{header{padding:10px 0;background:none;color:#000}main{margin:0}.bar,.tabs,
thead tr.f,footer{display:none}.card{box-shadow:none}.wrap{max-height:none;overflow:visible}
thead th{position:static;background:#1f4e78!important;-webkit-print-color-adjust:exact;
print-color-adjust:exact}tfoot td{position:static}}
</style></head><body>
<header><h1 id="ttl"></h1>
<div class="sub" id="sub"></div></header>
<main><div class="card">
<div class="tabs" id="tabs"></div>
<div class="bar">
 <div class="search"><svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor"
 d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3.6 3.6 1.4-1.4-3.6-3.6zM6.5 11a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/>
 </svg><input id="q" type="search" placeholder="Buscar en todas las columnas…"></div>
 <div class="menu"><button class="btn" id="colsBtn">▦ Columnas</button><div class="drop" id="cols"></div></div>
 <button class="btn" id="clear">✕ Limpiar filtros</button>
 <button class="btn" id="csv">⬇ CSV de lo visible</button>
 <button class="btn" id="print">🖨 Imprimir</button>
 <button class="btn primary" id="theme">◐ Modo oscuro</button>
</div>
<div class="titles" id="titles"></div>
<div class="chips" id="chips"></div>
<div class="wrap"><table id="tbl"></table></div>
</div></main>
<footer>Generado por EnterpriseBot · Grupo Álvarez</footer>
<script id="data" type="application/json">{{ data_json|safe }}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById("data").textContent);
var S=D.sheets.map(function(){return {q:"",f:{},sort:null,dir:1,hide:{}};});
var cur=0;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function hl(t,q){if(!q)return esc(t);var n=norm(t),i=n.indexOf(q);if(i<0)return esc(t);
 return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));}
function fmt(n){var p=Math.abs(n%1)>1e-9?2:0;return n.toLocaleString("es-ES",
 {minimumFractionDigits:p,maximumFractionDigits:p});}
function visibleRows(){var sh=D.sheets[cur],st=S[cur],q=norm(st.q),rows=sh.rows.filter(function(r){
  if(q&&!r.some(function(c){return norm(c.t).indexOf(q)>=0;}))return false;
  for(var k in st.f){var v=norm(st.f[k]);if(v&&norm(r[k].t).indexOf(v)<0)return false;}
  return true;});
 if(st.sort!==null){var c=st.sort,d=st.dir;rows=rows.slice().sort(function(a,b){
  var x=a[c],y=b[c],kx=("k" in x)?x.k:null,ky=("k" in y)?y.k:null;
  if(kx!==null&&ky!==null)return (kx-ky)*d;if(kx!==null)return -1;if(ky!==null)return 1;
  return x.t.localeCompare(y.t,"es",{numeric:true,sensitivity:"base"})*d;});}
 return rows;}
function renderTabs(){var h="";if(D.sheets.length>1)D.sheets.forEach(function(s,i){
 h+='<button class="tab'+(i===cur?" on":"")+'" data-i="'+i+'">'+esc(s.name)+" · "+s.rows.length+"</button>";});
 var t=document.getElementById("tabs");t.innerHTML=h;t.style.display=h?"flex":"none";}
function renderCols(){var sh=D.sheets[cur],st=S[cur],h="";sh.columns.forEach(function(c,i){
 h+='<label><input type="checkbox" data-c="'+i+'"'+(st.hide[i]?"":" checked")+"> "+esc(c.label)+"</label>";});
 document.getElementById("cols").innerHTML=h;}
function renderHead(){var sh=D.sheets[cur],st=S[cur],a="<thead><tr>",b='<tr class="f">';
 sh.columns.forEach(function(c,i){if(st.hide[i])return;var on=st.sort===i;
  a+='<th data-s="'+i+'" class="'+(c.num?"num ":"")+(on?"sorted":"")+'">'+esc(c.label)+
   '<span class="arrow">'+(on?(st.dir>0?"▲":"▼"):"↕")+"</span></th>";
  b+='<th><input data-f="'+i+'" placeholder="Filtrar…" value="'+esc(st.f[i]||"")+'"></th>';});
 return a+"</tr>"+b+"</tr></thead>";}
function renderBody(){var sh=D.sheets[cur],st=S[cur],rows=visibleRows(),q=norm(st.q),h="<tbody>";
 if(!rows.length)h+='<tr><td colspan="'+sh.columns.length+'"><div class="empty">Ningún resultado con estos filtros.</div></td></tr>';
 rows.forEach(function(r){h+="<tr>";r.forEach(function(c,i){if(st.hide[i])return;
  var fq=st.f[i]?norm(st.f[i]):q;h+='<td class="'+(sh.columns[i].num?"num":"")+'">'+hl(c.t,fq)+"</td>";});h+="</tr>";});
 h+="</tbody>";if(sh.totals.length){h+="<tfoot>";sh.totals.forEach(function(t){h+="<tr>";
  t.forEach(function(v,i){if(!st.hide[i])h+='<td class="'+(sh.columns[i].num?"num":"")+'">'+esc(v)+"</td>";});h+="</tr>";});
  h+="</tfoot>";}
 return {html:h,rows:rows};}
function renderChips(rows){var sh=D.sheets[cur],h='<span class="chip">Filas<b>'+rows.length+
 (rows.length!==sh.rows.length?" de "+sh.rows.length:"")+"</b></span>";
 sh.columns.forEach(function(c,i){if(!c.num||S[cur].hide[i])return;var s=0;
  rows.forEach(function(r){if(typeof r[i].k==="number")s+=r[i].k;});
  h+='<span class="chip">Σ '+esc(c.label)+"<b>"+fmt(s)+"</b></span>";});
 document.getElementById("chips").innerHTML=h;}
function render(keepFocus){var sh=D.sheets[cur];
 document.getElementById("titles").innerHTML=sh.titles.map(esc).join(" · ");
 var body=renderBody();document.getElementById("tbl").innerHTML=renderHead()+body.html;
 renderChips(body.rows);
 if(keepFocus){var el=document.querySelector('[data-f="'+keepFocus+'"]');
  if(el){el.focus();var v=el.value;el.setSelectionRange(v.length,v.length);}}}
function all(){renderTabs();renderCols();document.getElementById("q").value=S[cur].q;render();}
document.getElementById("ttl").textContent=D.title;
document.getElementById("sub").textContent="Generado el "+D.generated+
 (D.sheets.length>1?" · "+D.sheets.length+" hojas":"");
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");
 if(b){cur=+b.dataset.i;all();}});
document.getElementById("q").addEventListener("input",function(e){S[cur].q=e.target.value;render();});
document.getElementById("tbl").addEventListener("click",function(e){var th=e.target.closest("th[data-s]");
 if(!th)return;var i=+th.dataset.s,st=S[cur];if(st.sort===i){st.dir=-st.dir;}else{st.sort=i;st.dir=1;}render();});
document.getElementById("tbl").addEventListener("input",function(e){var i=e.target.dataset.f;
 if(i===undefined)return;S[cur].f[i]=e.target.value;render(i);});
document.getElementById("colsBtn").addEventListener("click",function(e){e.stopPropagation();
 document.getElementById("cols").classList.toggle("open");});
document.addEventListener("click",function(e){if(!e.target.closest(".menu"))
 document.getElementById("cols").classList.remove("open");});
document.getElementById("cols").addEventListener("change",function(e){var i=e.target.dataset.c;
 if(i===undefined)return;S[cur].hide[i]=!e.target.checked;render();});
document.getElementById("clear").addEventListener("click",function(){S[cur]={q:"",f:{},sort:null,dir:1,hide:{}};all();});
document.getElementById("print").addEventListener("click",function(){window.print();});
document.getElementById("theme").addEventListener("click",function(){document.body.classList.toggle("dark");});
document.getElementById("csv").addEventListener("click",function(){var sh=D.sheets[cur],st=S[cur],
 cols=sh.columns.map(function(c,i){return i;}).filter(function(i){return !st.hide[i];});
 function q(v){return '"'+String(v).replace(/"/g,'""')+'"';}
 var lines=[cols.map(function(i){return q(sh.columns[i].label);}).join(";")];
 visibleRows().forEach(function(r){lines.push(cols.map(function(i){return q(r[i].t);}).join(";"));});
 var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=(D.title+" - "+sh.name).replace(/[\\/:*?"<>|]/g,"_")+".csv";a.click();});
if(!D.sheets.length){document.getElementById("tbl").innerHTML='<tbody><tr><td><div class="empty">Sin datos.</div></td></tr></tbody>';}
else{all();}
})();
</script></body></html>
